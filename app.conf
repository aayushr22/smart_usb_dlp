# Smart USB DLP System - Main Application Configuration
# This file defines the app at the root level for Splunk

[install]
# Installation state and configuration
is_configured = 0
state = enabled
build = 1

[ui]
# User interface settings
is_visible = 1
label = Smart USB DLP System

[launcher]
# App launcher configuration
author = Build-a-thon Team
version = 1.0
description = ML-powered USB Data Loss Prevention system for detecting unusual data transfer patterns and potential exfiltration attempts

[package]
# Package metadata
id = smart_usb_dlp
check_for_updates = 1

[triggers]
# Configuration reload triggers
reload.apps = simple
reload.nav = simple