# USB Baseline Model Training - weekly
[USB Baseline Model Training]
search = | search index=usb_security sourcetype="usb:activity" earliest=-30d@d latest=now \
| eval hour=tonumber(strftime(_time, "%H")), day_of_week=tonumber(strftime(_time, "%w")) \
| stats avg(bytes_written) as avg_bytes, stdev(bytes_written) as std_bytes, count as session_count by user, device_type, hour, day_of_week \
| eval std_bytes=if(isnull(std_bytes) OR std_bytes=0, avg_bytes*0.1, std_bytes) \
| where session_count >= 3 \
| fit DBSCAN avg_bytes std_bytes session_count eps=0.5 min_samples=3 into usb_baseline_model
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
cron_schedule = 0 2 * * 0
enableSched = 1
is_scheduled = 1
allow_skew = 50%

# Real-time USB Anomaly Detection - Continuous
[USB Anomaly Detection]
search = | search index=usb_security sourcetype="usb:activity" earliest=-5m@m latest=now \
| eval hour=tonumber(strftime(_time, "%H")), day_of_week=tonumber(strftime(_time, "%w")) \
| stats avg(bytes_written) as avg_bytes, stdev(bytes_written) as std_bytes, count as session_count by user, device_type, hour, day_of_week, _time \
| eval std_bytes=if(isnull(std_bytes) OR std_bytes=0, avg_bytes*0.1, std_bytes) \
| apply usb_baseline_model \
| where cluster=-1 \
| eval risk_score=case(avg_bytes>1073741824, "HIGH", avg_bytes>536870912, "MEDIUM", 1=1, "LOW") \
| eval anomaly_reason=case(avg_bytes>1073741824, "Excessive data transfer (>1GB)", hour<7 OR hour>19, "Off-hours activity", session_count>10, "Frequent access", 1=1, "Statistical anomaly") \
| table _time, user, device_type, avg_bytes, risk_score, anomaly_reason
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
is_scheduled = 1
allow_skew = 50%

# High Risk USB Alert - Triggers on HIGH risk anomalies
[High Risk USB Activity Alert]
search = | search index=usb_security sourcetype="usb:activity" earliest=-15m@m latest=now \
| eval hour=tonumber(strftime(_time, "%H")), day_of_week=tonumber(strftime(_time, "%w")) \
| stats avg(bytes_written) as avg_bytes, stdev(bytes_written) as std_bytes, count as session_count by user, device_type, hour, day_of_week, _time \
| eval std_bytes=if(isnull(std_bytes) OR std_bytes=0, avg_bytes*0.1, std_bytes) \
| apply usb_baseline_model \
| where cluster=-1 AND avg_bytes>1073741824 \
| eval risk_score="HIGH", anomaly_reason="Potential data exfiltration detected" \
| eval alert_message="HIGH RISK: User " + user + " transferred " + round(avg_bytes/1048576,2) + " MB to " + device_type + " device" \
| table _time, user, device_type, avg_bytes, alert_message
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
is_scheduled = 1
allow_skew = 50%
actions = email
action.email.to = security@company.com
action.email.subject = USB DLP Alert: Potential Data Exfiltration
action.email.message.alert = $result.alert_message$

# USB Activity Summary Dashboard - Daily
[USB Activity Dashboard Summary]
search = | search index=usb_security sourcetype="usb:activity" earliest=-24h@h latest=now \
| eval hour=tonumber(strftime(_time, "%H")), size_mb=round(bytes_written/1048576,2) \
| stats sum(bytes_written) as total_bytes, count as total_sessions, dc(user) as unique_users, dc(device_id) as unique_devices by device_type \
| eval total_gb=round(total_bytes/1073741824,2) \
| sort -total_gb \
| eval avg_session_size=round(total_bytes/total_sessions/1048576,2) \
| table device_type, total_gb, total_sessions, unique_users, unique_devices, avg_session_size
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 */6 * * *
enableSched = 1
is_scheduled = 1
allow_skew = 50%

# User Behavior Analysis - Weekly user activity patterns
[User USB Behavior Analysis]
search = | search index=usb_security sourcetype="usb:activity" earliest=-7d@d latest=now \
| eval hour=tonumber(strftime(_time, "%H")), day_name=strftime(_time, "%A"), size_mb=round(bytes_written/1048576,2) \
| stats sum(bytes_written) as total_bytes, count as sessions, avg(bytes_written) as avg_bytes, values(device_type) as device_types by user \
| eval total_mb=round(total_bytes/1048576,2), avg_mb=round(avg_bytes/1048576,2) \
| eval usage_pattern=case(total_mb>5000, "Heavy User", total_mb>1000, "Moderate User", 1=1, "Light User") \
| sort -total_mb \
| head 20 \
| table user, total_mb, sessions, avg_mb, device_types, usage_pattern
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 0 6 * * 1
enableSched = 1
is_scheduled = 1
allow_skew = 50%

# Device Usage Trends - Track new and unusual devices
[Device Usage Trends]
search = | search index=usb_security sourcetype="usb:activity" earliest=-30d@d latest=now \
| stats count as usage_count, dc(user) as unique_users, sum(bytes_written) as total_bytes, earliest(_time) as first_seen, latest(_time) as last_seen by device_id, device_type \
| eval total_gb=round(total_bytes/1073741824,2), days_active=round((last_seen-first_seen)/86400,0) \
| eval first_seen_readable=strftime(first_seen, "%Y-%m-%d"), last_seen_readable=strftime(last_seen, "%Y-%m-%d") \
| eval device_status=case(first_seen>relative_time(now(), "-7d@d"), "New Device", days_active<2, "Infrequent", usage_count>100, "Frequent", 1=1, "Regular") \
| sort -total_gb \
| table device_id, device_type, device_status, total_gb, usage_count, unique_users, first_seen_readable, last_seen_readable
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
cron_schedule = 0 8 * * *
enableSched = 1
is_scheduled = 1
allow_skew = 50%

# Model Performance Monitoring
[USB ML Model Performance]
search = | search index=usb_security sourcetype="usb:activity" earliest=-24h@h latest=now \
| eval hour=tonumber(strftime(_time, "%H")), day_of_week=tonumber(strftime(_time, "%w")) \
| stats avg(bytes_written) as avg_bytes, stdev(bytes_written) as std_bytes, count as session_count by user, device_type, hour, day_of_week \
| eval std_bytes=if(isnull(std_bytes) OR std_bytes=0, avg_bytes*0.1, std_bytes) \
| apply usb_baseline_model \
| eval is_anomaly=if(cluster=-1, 1, 0) \
| stats count as total_events, sum(is_anomaly) as anomalies, avg(avg_bytes) as avg_transfer_size \
| eval anomaly_rate=round((anomalies/total_events)*100, 2), avg_transfer_mb=round(avg_transfer_size/1048576,2) \
| eval model_status=case(anomaly_rate>20, "High Alert Rate - Check Model", anomaly_rate<1, "Low Sensitivity - Retrain", 1=1, "Normal Operation") \
| table anomaly_rate, total_events, anomalies, avg_transfer_mb, model_status
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 12 * * *
enableSched = 1
is_scheduled = 1
allow_skew = 50%

