# USB DLP System Macros - Helper searches and filters

[usb_baseline_search]
definition = search index=usb_security sourcetype="usb:activity" earliest=-30d@d latest=now \
| eval hour=tonumber(strftime(_time, "%H")), day_of_week=tonumber(strftime(_time, "%w")) \
| stats avg(bytes_written) as avg_bytes, stdev(bytes_written) as std_bytes, count as session_count by user, device_type, hour, day_of_week \
| eval std_bytes=if(isnull(std_bytes) OR std_bytes=0, avg_bytes*0.1, std_bytes) \
| where session_count >= 3
args = 
iseval = 0

[usb_anomaly_detection]
definition = search index=usb_security sourcetype="usb:activity" earliest=$earliest$ latest=$latest$ \
| eval hour=tonumber(strftime(_time, "%H")), day_of_week=tonumber(strftime(_time, "%w")) \
| stats avg(bytes_written) as avg_bytes, stdev(bytes_written) as std_bytes, count as session_count by user, device_type, hour, day_of_week, _time \
| eval std_bytes=if(isnull(std_bytes) OR std_bytes=0, avg_bytes*0.1, std_bytes) \
| apply usb_baseline_model \
| where cluster=-1
args = earliest,latest
iseval = 0

[usb_risk_scoring]
definition = eval risk_score=case(avg_bytes>1073741824, "HIGH", avg_bytes>536870912, "MEDIUM", 1=1, "LOW"), \
anomaly_reason=case(avg_bytes>1073741824, "Excessive data transfer (>1GB)", hour<7 OR hour>19, "Off-hours activity", session_count>10, "Frequent access", 1=1, "Statistical anomaly")
args = 
iseval = 1

[usb_data_enrichment]
definition = eval size_mb=round(bytes_written/1048576,2), size_gb=round(bytes_written/1073741824,2) \
| lookup usb_device_types.csv device_type OUTPUT typical_capacity, risk_level, common_use \
| eval time_category=case(hour>=8 AND hour<=17, "Business Hours", hour>=18 OR hour<=6, "Off Hours", 1=1, "Other")
args = 
iseval = 1

[usb_filter_recent]
definition = search index=usb_security sourcetype="usb:activity" earliest=-$timespan$@$timeunit$ latest=now
args = timespan,timeunit
iseval = 0

[usb_user_summary]
definition = stats sum(bytes_written) as total_bytes, count as total_sessions, dc(device_id) as unique_devices, avg(bytes_written) as avg_bytes by user \
| eval total_mb=round(total_bytes/1048576,2), avg_mb=round(avg_bytes/1048576,2) \
| eval usage_pattern=case(total_mb>5000, "Heavy User", total_mb>1000, "Moderate User", 1=1, "Light User")
args = 
iseval = 0