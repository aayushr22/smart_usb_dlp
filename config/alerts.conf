[USB_High_Threat_Alert]
search = index=usb_security threat_level IN("HIGH","CRITICAL") | stats count by device_info.device_id, threat_level | where count > 0
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
description = Alert when high or critical threat USB devices are detected
is_scheduled = 1
actions = email, webhook

[USB_Multiple_Connections_Alert]
search = index=usb_security event_type="usb_device_connected" | bucket _time span=1m | stats count by _time | where count > 5
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
cron_schedule = */10 * * * *
description = Alert when multiple USB devices connect rapidly
is_scheduled = 1
actions = email

[USB_Monitoring_Down_Alert]
search = index=usb_security event_type="monitoring_started" | stats latest(_time) as last_seen | eval minutes_ago = (now() - last_seen) / 60 | where minutes_ago > 10
dispatch.earliest_time = -1h@h
dispatch.latest_time = now
cron_schedule = */15 * * * *
description = Alert when USB monitoring appears to be down
is_scheduled = 1
actions = email

[USB_Unknown_Device_Alert]
search = index=usb_security event_type="usb_device_connected" NOT device_info.label=* | stats count by device_info.device_id | where count > 0
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
description = Alert when unknown USB devices are connected
is_scheduled = 1
actions = email