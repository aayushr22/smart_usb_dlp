[usb_device_lookup]
filename = usb_device_types.csv
case_sensitive_match = false

[usb_device_info]
filename = usb_device_types.csv
case_sensitive_match = false
min_matches = 1
default_match = Unknown

[usb_risk_classification]
filename = usb_device_types.csv
case_sensitive_match = false
match_type = WILDCARD(device_type)

[usb_manufacturer_lookup]
filename = usb_device_types.csv
case_sensitive_match = false
match_type = WILDCARD(manufacturer)

[usb_capacity_lookup]
filename = usb_device_types.csv
case_sensitive_match = false
match_type = WILDCARD(typical_capacity)

[usb_security_features]
filename = usb_device_types.csv
case_sensitive_match = false
match_type = WILDCARD(security_features)

[usb_transfer_speed]
filename = usb_device_types.csv
case_sensitive_match = false
match_type = WILDCARD(transfer_speed)

[extract_usb_device_info]
REGEX = device_type=([^,\s]+)
FORMAT = device_type::$1

[extract_bytes_written]
REGEX = bytes_written[=:](\d+)
FORMAT = bytes_written::$1

[extract_user_info]
REGEX = user[=:]([^,\s]+)
FORMAT = user::$1

[extract_device_id]
REGEX = device_id[=:]([^,\s]+)
FORMAT = device_id::$1

[extract_session_duration]
REGEX = session_duration[=:](\d+)
FORMAT = session_duration::$1

[extract_timestamp]
REGEX = timestamp[=:]([^,\s]+)
FORMAT = timestamp::$1